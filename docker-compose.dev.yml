      MEMGRAPH_PASS: ${MEMGRAPH_PASS:-}
    depends_on:
      postgres:
        condition: service_healthy
      memgraph:
        condition: service_healthy
    command: ["sh", "-lc", "apk add --no-cache bash netcat-openbsd postgresql-client >/dev/null 2>&1; export PATH=/usr/local/go/bin:$PATH; go run ./workers/photos/cmd"]

volumes:
  postgres_dev_data:
  memgraph_dev_data:
  frontend_node_modules:
  frontend_next:
