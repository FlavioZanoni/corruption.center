services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: corruption
      POSTGRES_PASSWORD: corruption
      POSTGRES_DB: corruption
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corruption -d corruption"]
      interval: 5s
      timeout: 5s
      retries: 10

  memgraph:
    image: memgraph/memgraph:latest
    restart: unless-stopped
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - memgraph_dev_data:/var/lib/memgraph
    command: ["--storage-snapshot-interval-sec=3600", "--storage-snapshot-on-exit=true", "--storage-wal-enabled=true"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/7687'"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgres://corruption:corruption@postgres:5432/corruption?sslmode=disable
      MEMGRAPH_URI: bolt://memgraph:7687
      MEMGRAPH_USER: ${MEMGRAPH_USER:-}
      MEMGRAPH_PASS: ${MEMGRAPH_PASS:-}
      BACKOFFICE_USER: ${BACKOFFICE_USER:-admin}
      BACKOFFICE_PASS: ${BACKOFFICE_PASS:-changeme}
      PORT: "8080"
      DEV: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      memgraph:
        condition: service_healthy
    command: ["air", "-c", ".air.toml"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      # pnpm 11 runs a deps check before `pnpm dev`; CI=true makes it
      # auto-confirm instead of aborting on the container's missing TTY
      CI: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - api
    command: ["pnpm", "dev"]

  camara-sync:
    image: golang:1.25-alpine
    profiles: ["workers"]
    restart: "no"
    working_dir: /workspace/backend
    volumes:
      - ./:/workspace
    environment:
      DATABASE_URL: postgres://corruption:corruption@postgres:5432/corruption?sslmode=disable
      MEMGRAPH_URI: bolt://memgraph:7687
      MEMGRAPH_USER: ${MEMGRAPH_USER:-}
      MEMGRAPH_PASS: ${MEMGRAPH_PASS:-}
    depends_on:
      postgres:
        condition: service_healthy
      memgraph:
        condition: service_healthy
    command: ["sh", "-lc", "apk add --no-cache bash netcat-openbsd postgresql-client >/dev/null 2>&1; export PATH=/usr/local/go/bin:$PATH; go run ./workers/camara/cmd --persist-db"]

  senado-sync:
    image: golang:1.25-alpine
    profiles: ["workers"]
    restart: "no"
    working_dir: /workspace/backend
    volumes:
      - ./:/workspace
    environment:
      DATABASE_URL: postgres://corruption:corruption@postgres:5432/corruption?sslmode=disable
      MEMGRAPH_URI: bolt://memgraph:7687
      MEMGRAPH_USER: ${MEMGRAPH_USER:-}
      MEMGRAPH_PASS: ${MEMGRAPH_PASS:-}
    depends_on:
      postgres:
        condition: service_healthy
      memgraph:
        condition: service_healthy
    command: ["sh", "-lc", "apk add --no-cache bash netcat-openbsd postgresql-client >/dev/null 2>&1; export PATH=/usr/local/go/bin:$PATH; go run ./workers/senado/cmd --persist-db"]

  datajud-watcher:
    image: golang:1.25-alpine
    profiles: ["workers"]
    restart: "no"
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      DATABASE_URL: postgres://corruption:corruption@postgres:5432/corruption?sslmode=disable
      MEMGRAPH_URI: bolt://memgraph:7687
      MEMGRAPH_USER: ${MEMGRAPH_USER:-}
      MEMGRAPH_PASS: ${MEMGRAPH_PASS:-}
      DATAJUD_API_KEY: ${DATAJUD_API_KEY:-}
      ENABLE_WRITES: "true"
      VERIFY_TPU: "true"
      STRICT_VERIFY: "false"
      DATAJUD_POLL_LIMIT: "50"
      DATAJUD_PROBE_CASE: ""
      DATAJUD_PROBE_TRIBUNAL: ""
    depends_on:
      postgres:
        condition: service_healthy
      memgraph:
        condition: service_healthy
    command: ["sh", "-lc", "apk add --no-cache bash netcat-openbsd postgresql-client >/dev/null 2>&1; export PATH=/usr/local/go/bin:$PATH; ./deploy/datajud-watcher.sh"]

  djen-sync:
    image: golang:1.25-alpine
    profiles: ["workers"]
    restart: "no"
    working_dir: /workspace/backend
    volumes:
      - ./:/workspace
    environment:
      DATABASE_URL: postgres://corruption:corruption@postgres:5432/corruption?sslmode=disable
      MEMGRAPH_URI: bolt://memgraph:7687
      MEMGRAPH_USER: ${MEMGRAPH_USER:-}
      MEMGRAPH_PASS: ${MEMGRAPH_PASS:-}
    depends_on:
      postgres:
        condition: service_healthy
      memgraph:
        condition: service_healthy
    command: ["sh", "-lc", "apk add --no-cache bash netcat-openbsd postgresql-client >/dev/null 2>&1; export PATH=/usr/local/go/bin:$PATH; go run ./workers/djen/cmd"]

  sanctions-sync:
    image: golang:1.25-alpine
    profiles: ["workers"]
    restart: "no"
    working_dir: /workspace/backend
    volumes:
      - ./:/workspace
    environment:
      DATABASE_URL: postgres://corruption:corruption@postgres:5432/corruption?sslmode=disable
      MEMGRAPH_URI: bolt://memgraph:7687
      MEMGRAPH_USER: ${MEMGRAPH_USER:-}
      MEMGRAPH_PASS: ${MEMGRAPH_PASS:-}
      TRANSPARENCIA_API_KEY: ${TRANSPARENCIA_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      memgraph:
        condition: service_healthy
    command: ["sh", "-lc", "apk add --no-cache bash netcat-openbsd postgresql-client >/dev/null 2>&1; export PATH=/usr/local/go/bin:$PATH; go run ./workers/sanctions/cmd"]

  cnpj-enricher:
    image: golang:1.25-alpine
    profiles: ["workers"]
    restart: "no"
    working_dir: /workspace/backend
    volumes:
      - ./:/workspace
    environment:
      DATABASE_URL: postgres://corruption:corruption@postgres:5432/corruption?sslmode=disable
      MEMGRAPH_URI: bolt://memgraph:7687
      MEMGRAPH_USER: ${MEMGRAPH_USER:-}
      MEMGRAPH_PASS: ${MEMGRAPH_PASS:-}
      CNPJ_API_BASE: ${CNPJ_API_BASE:-https://minhareceita.org}
      CNPJ_RATE_PER_MIN: ${CNPJ_RATE_PER_MIN:-30}
    depends_on:
      postgres:
        condition: service_healthy
      memgraph:
        condition: service_healthy
    command: ["sh", "-lc", "apk add --no-cache bash netcat-openbsd postgresql-client >/dev/null 2>&1; export PATH=/usr/local/go/bin:$PATH; go run ./workers/cnpj/cmd"]

  photos-enricher:
    image: golang:1.25-alpine
    profiles: ["workers"]
    restart: "no"
    working_dir: /workspace/backend
    volumes:
      - ./:/workspace
    environment:
      DATABASE_URL: postgres://corruption:corruption@postgres:5432/corruption?sslmode=disable
      MEMGRAPH_URI: bolt://memgraph:7687
