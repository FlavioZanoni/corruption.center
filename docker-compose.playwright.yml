# Override for running the stack alongside other projects that already hold
# :3000 (gemu-web) and :8080 (gemu-server). Remaps the two host ports and
# repoints the browser-facing API URL so client-side calls reach the API.
#   docker compose -f docker-compose.dev.yml -f docker-compose.playwright.yml up -d postgres memgraph api frontend
services:
  api:
    # The browser (served from :3001 here, not the usual :3000) calls the API
    # cross-origin, so the API must allow that origin. Setting this env replaces
    # the default allowlist, so keep :3000 too.
    environment:
      CORS_ALLOWED_ORIGINS: "http://localhost:3001,http://localhost:3000"
    ports: !override
      - "8090:8080"
  frontend:
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8090
    ports: !override
      - "3001:3000"
